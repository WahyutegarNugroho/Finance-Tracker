packages:
  - 'apps/*'

# overrides: Pin package resolutions to resolve OWASP-audited dependency vulnerabilities
overrides:
  "brace-expansion@<2": "1.1.18"
  "brace-expansion@>=3": "5.0.9"
  "js-yaml": "4.3.1"
  "postcss": "8.5.26"
  "nanoid": "3.3.18"
  "ip-address": "10.5.0"
  "sharp": "0.35.5"
  "shell-quote": "1.12.0"
  "proxy-addr": "2.0.8"
  "@fastify/busboy": "3.2.4"
  "source-map-js": "1.2.2"

onlyBuiltDependencies:
  - "@firebase/util"
  - "protobufjs"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  sharp: true
  unrs-resolver: true
